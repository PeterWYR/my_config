# Dev layout: 左边大窗格 | 右边上下两个窗格
#
#  ┌──────────┬──────────┐
#  │          │          │
#  │          │   右上    │
#  │          │          │
#  │   左侧   ├──────────┤
#  │          │          │
#  │          │   右下    │
#  │          │          │
#  └──────────┴──────────┘

layout splits

# 左侧主窗格
launch zsh

# 右上窗格（垂直分割）
launch --location=vsplit zsh

# 右下窗格（对右上做水平分割）
launch --location=hsplit zsh
